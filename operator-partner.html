<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operator — Kelola Mitra SMAN 68</title>
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/id/1/19/Logo_SMAN_68_Jakarta.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="./firebase-config.js"></script>

    <style>
        /* ─── Variables ─────────────────────── */
        :root {
            --gold:       #C9A84C;
            --gold-light: #E8C97A;
            --gold-dim:   #8B6B2A;
            --cream:      #F5EDD8;
            --dark:       #0A0A0B;
            --dark-2:     #111114;
            --dark-3:     #18181D;
            --dark-4:     #222229;
            --dark-5:     #2E2E38;
            --red:        #E05555;
            --green:      #55C99A;
            --radius-sm:  8px;
            --radius-md:  14px;
            --radius-lg:  20px;
            --transition: cubic-bezier(0.23,1,0.32,1);
            --font-display: 'Cormorant Garamond', serif;
            --font-body:    'DM Sans', sans-serif;
        }
        *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            background: var(--dark);
            color: #fff;
            font-family: var(--font-body);
            min-height: 100vh;
            padding-bottom: 80px;
        }
        img { display:block; max-width:100%; }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }

        /* ─── Topbar ─────────────────────── */
        .topbar {
            background: var(--dark-2);
            border-bottom: 1px solid rgba(201,168,76,0.12);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .topbar-logo {
            width: 36px; height: 36px;
            object-fit: contain;
            filter: drop-shadow(0 0 8px rgba(201,168,76,0.3));
        }
        .topbar-title {
            font-family: var(--font-display);
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
        }
        .topbar-sub {
            font-size: 11px;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
        }
        .topbar-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 100px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.04em;
            transition: all 0.25s var(--transition);
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold), var(--gold-dim));
            color: var(--dark);
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(201,168,76,0.3);
        }
        .btn-outline {
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.55);
            background: rgba(255,255,255,0.04);
        }
        .btn-outline:hover {
            border-color: rgba(201,168,76,0.3);
            color: var(--gold-light);
        }

        /* ─── Layout ─────────────────────── */
        .layout {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 24px;
            display: grid;
            grid-template-columns: 1fr 1.6fr;
            gap: 32px;
            align-items: start;
        }
        @media (max-width: 768px) {
            .layout { grid-template-columns: 1fr; }
        }

        /* ─── Panel ──────────────────────── */
        .panel {
            background: var(--dark-3);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .panel-header {
            padding: 24px 28px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .panel-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--cream);
        }
        .panel-count {
            font-size: 12px;
            background: rgba(201,168,76,0.1);
            border: 1px solid rgba(201,168,76,0.2);
            color: var(--gold-light);
            padding: 4px 12px;
            border-radius: 100px;
        }
        .panel-body { padding: 28px; }

        /* ─── Form ───────────────────────── */
        .form-grid { display: grid; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-label {
            font-size: 12px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255,255,255,0.45);
            font-weight: 500;
        }
        .form-label span { color: var(--gold); margin-left: 2px; }
        .form-input, .form-textarea, .form-select {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: #fff;
            font-family: var(--font-body);
            font-size: 14px;
            outline: none;
            width: 100%;
            transition: border-color 0.25s, background 0.25s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            border-color: rgba(201,168,76,0.45);
            background: rgba(201,168,76,0.04);
        }
        .form-textarea { resize: vertical; min-height: 100px; line-height: 1.6; }
        .form-select option { background: var(--dark-3); }
        .form-select { appearance: none; }
        .input-hint {
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            margin-top: 4px;
        }

        /* Logo preview */
        .logo-preview-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: var(--radius-sm);
        }
        .logo-preview {
            width: 56px; height: 56px;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            object-fit: contain;
            padding: 4px;
            flex-shrink: 0;
            display: none;
        }
        .logo-placeholder {
            width: 56px; height: 56px;
            border-radius: 10px;
            background: var(--dark-5);
            border: 1.5px dashed rgba(201,168,76,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(201,168,76,0.3);
            flex-shrink: 0;
            font-size: 22px;
        }
        .logo-status {
            font-size: 13px;
            color: rgba(255,255,255,0.35);
        }

        /* Form actions */
        .form-actions {
            display: flex;
            gap: 10px;
            padding-top: 4px;
        }
        .btn-submit {
            flex: 1;
            justify-content: center;
            padding: 13px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
        }
        .btn-reset {
            padding: 13px 20px;
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        .btn-reset:hover {
            border-color: rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
        }

        /* ─── Partner List ───────────────── */
        .partner-list { display: flex; flex-direction: column; gap: 0; }
        .list-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item:hover { background: rgba(255,255,255,0.02); }
        .list-logo {
            width: 44px; height: 44px;
            border-radius: 10px;
            background: rgba(255,255,255,0.9);
            object-fit: contain;
            padding: 3px;
            flex-shrink: 0;
        }
        .list-logo-fallback {
            width: 44px; height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 18px;
            color: var(--dark);
            flex-shrink: 0;
        }
        .list-info { flex: 1; min-width: 0; }
        .list-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--cream);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .list-cat {
            font-size: 11px;
            color: var(--gold);
            letter-spacing: 0.06em;
            margin-top: 2px;
        }
        .list-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .btn-edit, .btn-delete {
            width: 32px; height: 32px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .btn-edit {
            border: 1px solid rgba(201,168,76,0.2);
            color: rgba(201,168,76,0.6);
        }
        .btn-edit:hover { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.08); }
        .btn-delete {
            border: 1px solid rgba(224,85,85,0.2);
            color: rgba(224,85,85,0.6);
        }
        .btn-delete:hover { border-color: var(--red); color: var(--red); background: rgba(224,85,85,0.08); }

        /* ─── Toast ──────────────────────── */
        .toast {
            position: fixed;
            bottom: 32px; right: 32px;
            z-index: 999;
            background: var(--dark-4);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: var(--radius-md);
            padding: 16px 24px;
            font-size: 14px;
            color: rgba(255,255,255,0.85);
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.35s var(--transition);
            max-width: 340px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { border-color: rgba(85,201,154,0.3); }
        .toast.error   { border-color: rgba(224,85,85,0.3); }
        .toast-icon { font-size: 18px; flex-shrink: 0; }

        /* ─── Loading / Empty ────────────── */
        .list-loading {
            text-align: center;
            padding: 48px 24px;
            color: rgba(255,255,255,0.3);
            font-size: 14px;
        }
        .loader-sm {
            width: 32px; height: 32px;
            border: 2px solid rgba(201,168,76,0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            margin: 0 auto 16px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Editing mode badge */
        .edit-badge {
            display: none;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(201,168,76,0.1);
            border: 1px solid rgba(201,168,76,0.25);
            border-radius: 100px;
            font-size: 12px;
            color: var(--gold-light);
            letter-spacing: 0.06em;
        }
        .edit-badge.visible { display: flex; }
        .edit-badge button {
            color: rgba(255,255,255,0.4);
            font-size: 14px;
            line-height: 1;
            transition: color 0.2s;
        }
        .edit-badge button:hover { color: var(--red); }
    </style>
</head>
<body>

    <!-- Topbar -->
    <nav class="topbar">
        <div class="topbar-left">
            <img src="https://upload.wikimedia.org/wikipedia/id/1/19/Logo_SMAN_68_Jakarta.png" alt="SMAN 68" class="topbar-logo">
            <div>
                <div class="topbar-title">Kelola Mitra</div>
                <div class="topbar-sub">Operator Panel — SMAN 68 Jakarta</div>
            </div>
        </div>
        <div class="topbar-right">
            <a href="./partner-sman-68-jakarta.html" class="btn btn-outline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                Lihat Tampilan
            </a>
            <a href="./sman68.html" class="btn btn-outline">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                Beranda
            </a>
        </div>
    </nav>

    <!-- Layout -->
    <div class="layout">

        <!-- Left: Form -->
        <div class="panel" id="formPanel">
            <div class="panel-header">
                <span class="panel-title">Tambah Mitra</span>
                <div class="edit-badge" id="editBadge">
                    ✏️ Mode Edit
                    <button onclick="resetForm()" title="Batal edit">✕</button>
                </div>
            </div>
            <div class="panel-body">
                <form class="form-grid" id="partnerForm" onsubmit="handleSubmit(event)">

                    <div class="form-group">
                        <label class="form-label" for="inputName">Nama Mitra <span>*</span></label>
                        <input type="text" id="inputName" class="form-input" placeholder="Contoh: Universitas Indonesia" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="inputCategory">Kategori <span>*</span></label>
                        <input type="text" id="inputCategory" class="form-input"
                            placeholder="Contoh: Perguruan Tinggi" list="categoryList" required>
                        <datalist id="categoryList">
                            <option value="Perguruan Tinggi">
                            <option value="Perusahaan">
                            <option value="Lembaga Pemerintah">
                            <option value="LSM & Komunitas">
                            <option value="Media & Pers">
                            <option value="Kesehatan">
                            <option value="Teknologi">
                            <option value="Pendidikan">
                        </datalist>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="inputLogo">URL Logo Mitra <span>*</span></label>
                        <input type="url" id="inputLogo" class="form-input"
                            placeholder="https://example.com/logo.png" required
                            oninput="previewLogo(this.value)">
                        <p class="input-hint">Masukkan URL gambar logo (PNG, JPG, SVG disarankan)</p>
                        <div class="logo-preview-wrap" style="margin-top:10px;">
                            <div class="logo-placeholder" id="logoPlaceholder">🖼️</div>
                            <img id="logoPreview" class="logo-preview" alt="Preview logo">
                            <span class="logo-status" id="logoStatus">Preview logo akan tampil di sini</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="inputDesc">Deskripsi <span>*</span></label>
                        <textarea id="inputDesc" class="form-textarea"
                            placeholder="Deskripsikan bentuk kerja sama atau profil singkat mitra..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="inputWebsite">Website / Link</label>
                        <input type="url" id="inputWebsite" class="form-input"
                            placeholder="https://website-mitra.com">
                        <p class="input-hint">Opsional — link yang akan dibuka saat tombol "Kunjungi" diklik</p>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-gold btn-submit" id="submitBtn">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
                            <span id="submitLabel">Simpan Mitra</span>
                        </button>
                        <button type="button" class="btn-reset" onclick="resetForm()">Reset</button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Right: List -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Daftar Mitra</span>
                <span class="panel-count" id="listCount">0 mitra</span>
            </div>
            <div id="partnerListWrap">
                <div class="list-loading">
                    <div class="loader-sm"></div>
                    Memuat data...
                </div>
            </div>
        </div>

    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon"></span>
        <span id="toastMsg"></span>
    </div>

    <script>
    (function() {
        'use strict';

        // ─── Firebase Init ──────────────────
        let db;
        try {
            if (!window.__FIREBASE_CONFIG__) throw new Error('Config tidak ditemukan');
            if (!firebase.apps.length) firebase.initializeApp(window.__FIREBASE_CONFIG__);
            db = firebase.firestore();
        } catch (e) {
            showToast('error', '⚠️', 'Firebase gagal diinisialisasi: ' + e.message);
        }

        const COLLECTION = 'partners_sman68';

        // ─── State ──────────────────────────
        let partners = [];
        let editingId = null;

        // ─── DOM ────────────────────────────
        const $ = id => document.getElementById(id);

        // ─── Load ────────────────────────────
        async function loadPartners() {
            if (!db) return;
            try {
                const snap = await db.collection(COLLECTION).orderBy('createdAt', 'desc').get();
                partners = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderList();
            } catch (e) {
                $('partnerListWrap').innerHTML = `<div class="list-loading" style="color:rgba(224,85,85,0.7);">Gagal memuat data.</div>`;
            }
        }

        // ─── Render List ─────────────────────
        function renderList() {
            $('listCount').textContent = `${partners.length} mitra`;
            if (!partners.length) {
                $('partnerListWrap').innerHTML = `<div class="list-loading">Belum ada mitra. Tambahkan melalui form di sebelah kiri.</div>`;
                return;
            }
            const html = partners.map(p => `
                <div class="list-item" id="item-${p.id}">
                    ${p.logoUrl
                        ? `<img class="list-logo" src="${esc(p.logoUrl)}" alt="${esc(p.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                        : ''}
                    <div class="list-logo-fallback" style="${p.logoUrl ? 'display:none' : ''}">${esc((p.name||'?')[0].toUpperCase())}</div>
                    <div class="list-info">
                        <div class="list-name">${esc(p.name || '-')}</div>
                        <div class="list-cat">${esc(p.category || '-')}</div>
                    </div>
                    <div class="list-actions">
                        <button class="btn-edit" onclick="startEdit('${p.id}')" title="Edit">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                        <button class="btn-delete" onclick="deletePartner('${p.id}')" title="Hapus">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                        </button>
                    </div>
                </div>`).join('');
            $('partnerListWrap').innerHTML = `<div class="partner-list">${html}</div>`;
        }

        // ─── Submit ──────────────────────────
        window.handleSubmit = async function(e) {
            e.preventDefault();
            if (!db) return showToast('error', '⚠️', 'Database tidak tersedia');

            const name     = $('inputName').value.trim();
            const category = $('inputCategory').value.trim();
            const logoUrl  = $('inputLogo').value.trim();
            const description = $('inputDesc').value.trim();
            const website  = $('inputWebsite').value.trim();

            const data = { name, category, logoUrl, description, website,
                           updatedAt: firebase.firestore.FieldValue.serverTimestamp() };

            $('submitBtn').disabled = true;
            $('submitLabel').textContent = 'Menyimpan...';

            try {
                if (editingId) {
                    await db.collection(COLLECTION).doc(editingId).update(data);
                    showToast('success', '✅', 'Mitra berhasil diperbarui!');
                } else {
                    data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
                    await db.collection(COLLECTION).add(data);
                    showToast('success', '✅', 'Mitra berhasil ditambahkan!');
                }
                resetForm();
                await loadPartners();
            } catch (err) {
                showToast('error', '❌', 'Gagal menyimpan: ' + err.message);
            } finally {
                $('submitBtn').disabled = false;
                $('submitLabel').textContent = editingId ? 'Perbarui Mitra' : 'Simpan Mitra';
            }
        };

        // ─── Edit ────────────────────────────
        window.startEdit = function(id) {
            const p = partners.find(x => x.id === id);
            if (!p) return;
            editingId = id;
            $('inputName').value     = p.name        || '';
            $('inputCategory').value = p.category    || '';
            $('inputLogo').value     = p.logoUrl     || '';
            $('inputDesc').value     = p.description || '';
            $('inputWebsite').value  = p.website     || '';
            previewLogo(p.logoUrl);
            $('editBadge').classList.add('visible');
            $('submitLabel').textContent = 'Perbarui Mitra';
            document.getElementById('formPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // ─── Delete ──────────────────────────
        window.deletePartner = async function(id) {
            if (!confirm('Hapus mitra ini? Tindakan ini tidak dapat dibatalkan.')) return;
            try {
                await db.collection(COLLECTION).doc(id).delete();
                showToast('success', '🗑️', 'Mitra berhasil dihapus.');
                await loadPartners();
            } catch (err) {
                showToast('error', '❌', 'Gagal menghapus: ' + err.message);
            }
        };

        // ─── Reset Form ──────────────────────
        window.resetForm = function() {
            editingId = null;
            $('partnerForm').reset();
            $('logoPreview').style.display = 'none';
            $('logoPlaceholder').style.display = 'flex';
            $('logoStatus').textContent = 'Preview logo akan tampil di sini';
            $('editBadge').classList.remove('visible');
            $('submitLabel').textContent = 'Simpan Mitra';
        };

        // ─── Logo Preview ────────────────────
        window.previewLogo = function(url) {
            const img = $('logoPreview');
            const ph  = $('logoPlaceholder');
            const st  = $('logoStatus');
            if (!url) {
                img.style.display = 'none'; ph.style.display = 'flex';
                st.textContent = 'Preview logo akan tampil di sini';
                return;
            }
            img.onload = () => {
                img.style.display = 'block'; ph.style.display = 'none';
                st.textContent = 'Logo berhasil dimuat ✓';
            };
            img.onerror = () => {
                img.style.display = 'none'; ph.style.display = 'flex';
                st.textContent = 'URL tidak valid atau gambar tidak dapat dimuat';
            };
            img.src = url;
        };

        // ─── Toast ───────────────────────────
        let toastTimer;
        function showToast(type, icon, msg) {
            const t = $('toast');
            $('toastIcon').textContent = icon;
            $('toastMsg').textContent  = msg;
            t.className = `toast ${type}`;
            clearTimeout(toastTimer);
            setTimeout(() => t.classList.add('show'), 10);
            toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
        }

        // ─── Escape ──────────────────────────
        function esc(str) {
            return String(str||'')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        // ─── Boot ────────────────────────────
        loadPartners();
    })();
    </script>
</body>
</html>
